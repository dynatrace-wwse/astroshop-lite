name: Helm — Package & Push OCI

on:
  # Manual only: the framework vendors the chart, so nothing consumes a published
  # OCI chart yet. Upstream published on every main push.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CHART_REPO: ghcr.io/dynatrace-wwse/astroshop-lite/charts

jobs:
  helm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package helm/opentelemetry-demo-light

      - name: Push to OCI registry
        run: |
          PKG=$(ls *.tgz)
          helm push "$PKG" oci://${{ env.CHART_REPO }}
